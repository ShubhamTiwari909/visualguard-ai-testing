<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="330" viewBox="0 0 1020 330" role="img" aria-labelledby="title desc">
<title id="title">VisualGuard execution and storage</title><desc id="desc">Application versions are captured by your browser worker. The worker saves local evidence and can publish it to a dashboard with persistent database storage. The dashboard can request work from the connected worker.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="m0 0 10 5-10 5" fill="#0c744d"/></marker></defs>
<rect width="1020" height="330" rx="16" fill="#effef7"/>
<g fill="#fff" stroke="#0c744d" stroke-width="2"><rect x="25" y="35" width="240" height="95" rx="12"/><rect x="355" y="35" width="270" height="95" rx="12"/><rect x="715" y="35" width="280" height="95" rx="12"/><rect x="355" y="220" width="270" height="85" rx="12"/><rect x="715" y="220" width="280" height="85" rx="12"/></g>
<g font-family="system-ui,sans-serif" text-anchor="middle" fill="#0f4b36"><g font-size="22" font-weight="650"><text x="145" y="76">Application versions</text><text x="490" y="76">Your browser worker</text><text x="855" y="76">Local evidence</text><text x="490" y="254">Shared dashboard</text><text x="855" y="254">Persistent database</text></g><g font-size="16"><text x="145" y="103">Reference + candidate</text><text x="490" y="103">Developer machine or CI</text><text x="855" y="103">Screenshots, findings, report</text><text x="490" y="281">History, review, requested tests</text><text x="855" y="281">Evidence + operational state</text><text x="670" y="249">Stores</text><text x="540" y="176">Optional upload /</text><text x="540" y="196">connected worker</text></g></g>
<g stroke="#0c744d" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M265 82H342"/><path d="M625 82H702"/><path d="M490 130V207" stroke-dasharray="5 5"/><path d="M625 270H702"/></g></svg>
