name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter visualguard exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test
        env:
          # Capture every fixture page 10× and require zero differences (PLAN.md §17).
          VG_DETERMINISM_RUNS: "10"
      - run: node scripts/pack-smoke.mjs

  example-nextjs:
    # Builds examples/nextjs, seeds regressions, and checks `visualguard fix` repairs them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter visualguard exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm --filter visualguard exec vitest run test/nextjs-example.test.ts
        env:
          VG_E2E_NEXT: "1"
