name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: visualguard
          POSTGRES_PASSWORD: visualguard
          POSTGRES_DB: visualguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U visualguard -d visualguard_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start transactional MongoDB replica set
        run: |
          docker run --detach --name visualguard-mongo-replica \
            --publish 27018:27018 mongo:7 \
            --replSet visualguard_ci --port 27018 --bind_ip_all
          for attempt in {1..60}; do
            if docker exec visualguard-mongo-replica mongosh --port 27018 --quiet \
              --eval 'quit(db.runCommand({ping: 1}).ok ? 0 : 1)' >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec visualguard-mongo-replica mongosh --port 27018 --quiet \
            --eval 'rs.initiate({_id: "visualguard_ci", members: [{_id: 0, host: "127.0.0.1:27018"}]})'
          for attempt in {1..60}; do
            if docker exec visualguard-mongo-replica mongosh --port 27018 --quiet \
              --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs visualguard-mongo-replica
          exit 1
      - run: pnpm platform:test
        env:
          VISUALGUARD_TEST_DATABASE_URL: postgresql://visualguard:visualguard@127.0.0.1:5432/visualguard_test
          VISUALGUARD_TEST_MONGODB_URL: mongodb://127.0.0.1:27018/visualguard_test?replicaSet=visualguard_ci
          VISUALGUARD_TEST_MONGODB_STANDALONE_URL: mongodb://127.0.0.1:27017/visualguard_test
      - run: pnpm platform:build
      - run: pnpm --filter visualguard build:dashboard
      - run: pnpm platform:test:package

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter visualguard exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test
        env:
          # Capture every fixture page 10× and require zero differences (PLAN.md §17).
          VG_DETERMINISM_RUNS: "10"
      - run: node scripts/pack-smoke.mjs

  browser-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter visualguard exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm --filter visualguard exec vitest run test/browser-smoke.test.ts
        env:
          VG_SMOKE_BROWSER: ${{ matrix.browser }}

  heuristic-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter visualguard exec playwright install --with-deps chromium
      - run: pnpm build
      - run: node evals/run.mjs --provider none --min-regression-recall 0.6 --min-regression-precision 0.85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heuristic-evals
          path: evals/results/

  example-nextjs:
    # Builds examples/nextjs, seeds regressions, and checks `visualguard fix` repairs them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter visualguard exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm --filter visualguard exec vitest run test/nextjs-example.test.ts
        env:
          VG_E2E_NEXT: "1"
