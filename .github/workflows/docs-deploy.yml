name: Deploy documentation

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: Canonical origin (no project path)
        required: true
        default: https://shubhamtiwari909.github.io
      base_path:
        description: Project path, or / for a dedicated domain
        required: true
        default: /visualguard-ai-testing

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      DOCS_SITE_URL: ${{ inputs.site_url }}
      DOCS_BASE_PATH: ${{ inputs.base_path }}
      DOCS_PRODUCTION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:test
      - run: pnpm docs:build
      - run: pnpm docs:check-links
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static documentation
        id: deployment
        uses: actions/deploy-pages@v4
